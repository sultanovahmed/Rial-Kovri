<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e99673">
<title>РИАЛ КОВРЫ</title><link rel="stylesheet" href="shop.css"></head>
<body>
<div class="Header"><header>
  <div><a href="index.html" style="text-decoration:none;color:#fff;margin:0"><h1>РИАЛ КОВРЫ</h1></a><p>Магазин</p></div>
  <div class="hbtns">
    <button class="ibtn" id="cartBtn">🛒<span class="badge" id="cartCount">0</span></button>
  </div>
</header></div>

<div class="dropboxes" id="filters"></div>

<main><div id="empty" class="empty" hidden>Данных ковров пока что нет. Но у нас есть множество других!</div>
<div id="cardsContainer"></div></main>

<!-- Модальное окно товара -->
<div id="productModal" class="overlay"><div class="modal">
  <button class="close" id="closeModal">X</button>
  <div class="grayBack"><button class="lrBtn" id="prev">←</button><img id="gImg" alt=""><button class="lrBtn" id="next">→</button></div>
  <div class="texts"><h1 id="mTitle"></h1><div class="tag">Характеристики</div>
    <div class="despretion" id="mSpecs"></div><p class="Cost" id="mPrice"></p>
    <button class="Buy" id="mBuy">Добавить в корзину</button></div>
</div></div>

<!-- Корзина -->
<aside class="drawer" id="drawer">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>Корзина</h2><button class="btn gray" id="closeCart">✕</button></div>
  <div class="list" id="cartList"></div>
  <p class="Cost" id="cartTotal"></p>
  <button class="Buy" id="checkout" style="height:48px;font-size:18px">Оформить заказ</button>
  <button class="btn gray" id="clearCart">Очистить</button>
</aside>

<!-- Оформление заказа -->
<div id="orderModal" class="overlay"><div class="box" style="width:min(440px,94%);margin:6vh auto">
  <button class="close" style="width:34px;height:34px;font-size:16px" id="orderClose">X</button>
  <div id="orderForm" style="display:flex;flex-direction:column;gap:10px">
    <h2>Оформление заказа</h2>
    <p id="orderSum" style="font-size:14px"></p>
    <label class="dropbox-label">ФИО<input class="field" id="oName" autocomplete="name" style="width:100%;font-weight:400" placeholder="Иванов Иван Иванович"></label>
    <label class="dropbox-label">Номер телефона<input class="field" id="oPhone" type="tel" autocomplete="tel" style="width:100%;font-weight:400" placeholder="+7 900 000-00-00"></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" id="oWa"> Есть WhatsApp на этом номере телефона</label>
    <label style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" id="oMax"> Есть MAX на этом номере телефона</label>
    <input id="oTrap" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <p id="oErr" style="color:#c0392b;font-size:13px"></p>
    <button class="Buy" id="oSend" style="height:50px;font-size:20px">Отправить заказ</button>
    <p style="font-size:12px">Оплата не на сайте: мы свяжемся с вами по указанному номеру и подтвердим заказ.</p>
  </div>
  <div id="orderDone" hidden style="text-align:center;display:none;flex-direction:column;gap:12px">
    <h2 id="doneTitle"></h2><p id="doneText"></p>
    <a class="btn" id="smsOrder" hidden style="text-decoration:none">Отправить SMS</a>
    <a class="btn" id="waOrder" hidden target="_blank" rel="noopener" style="text-decoration:none">Написать в WhatsApp</a>
    <button class="btn" id="copyOrder" hidden>Скопировать заказ</button>
    <button class="btn gray" id="doneClose">Закрыть</button>
  </div>
</div></div>
<div class="alert hidden" id="alertBox"></div>

<script src="common.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
let products=[],cur=null,idx=0;
const DB={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let cart=DB.get('cart',[]);            // [{id,count}] — хранится в браузере
const state={sort:'pop',size:'all',made:'all',color:'all',pattern:'all'};

function saveCart(){DB.set('cart',cart);renderCart()}
/* ---------- фильтры ---------- */
const uniq=a=>[...new Set(a)].sort();
function buildFilters(){
  const sel=(k,label,opts)=>`<div><label class="dropbox-label">${label}</label><select class="dropbox" data-k="${k}"><option value="all">все</option>${opts.map(o=>`<option value="${esc(o[0])}" ${state[k]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  const d=x=>[x,x];
  $('filters').innerHTML=
    sel('size','Размер',uniq(products.map(sizeOf)).map(d))+
    sel('made','Производство',uniq(products.map(p=>p.made)).map(d))+
    sel('color','Расцветка',uniq(products.map(p=>p.color)).map(d))+
    sel('pattern','Узор',[['yes','есть'],['no','нет']])+
    `<div><label class="dropbox-label">Сортировка</label><select class="dropbox" data-k="sort">
      <option value="pop" ${state.sort==='pop'?'selected':''}>Популярные</option>
      <option value="asc" ${state.sort==='asc'?'selected':''}>Сначала дешевле</option>
      <option value="desc" ${state.sort==='desc'?'selected':''}>Сначала дороже</option></select></div>
    <div style="align-self:end"><button class="btn light" id="reset">Сбросить</button></div>`;
  document.querySelectorAll('[data-k]').forEach(s=>s.onchange=()=>{state[s.dataset.k]=s.value;render()});
  $('reset').onclick=()=>{Object.assign(state,{sort:'pop',size:'all',made:'all',color:'all',pattern:'all'});buildFilters();render()};
}

function visible(){
  const list=products.filter(p=>
    (state.size==='all'||sizeOf(p)===state.size)&&(state.made==='all'||p.made===state.made)&&
    (state.color==='all'||p.color===state.color)&&(state.pattern==='all'||(state.pattern==='yes')===!!p.pattern));
  const by={pop:(a,b)=>(b.sales||0)-(a.sales||0),asc:(a,b)=>a.price-b.price,desc:(a,b)=>b.price-a.price}[state.sort];
  return list.sort(by);
}
function render(){
  const list=visible();
  $('cardsContainer').innerHTML=list.map(p=>`<div class="card" data-id="${p.id}">
    <img src="${p.image}" loading="lazy" alt=""><h2 class="title">${esc(p.title)}</h2><p class="price">${fmt(p.price)}₽</p>
    <button class="btn" data-add="${p.id}">В корзину</button></div>`).join('');
  $('empty').hidden=list.length>0;
}
$('cardsContainer').onclick=e=>{
  const add=e.target.closest('[data-add]');if(add)return addToCart(add.dataset.add);
  const c=e.target.closest('.card');if(c)openModal(c.dataset.id);
};

/* ---------- модальное окно ---------- */
const imgs=()=>[cur.image,...(cur.images||[])];
function openModal(id){
  cur=products.find(p=>p.id===id);idx=0;
  $('mTitle').textContent=cur.title;
  $('mSpecs').innerHTML=specs(cur).map(([l,v])=>`<div><span>${l}</span><b>${esc(v)}</b></div>`).join('');
  $('mPrice').textContent=`Цена: ${fmt(cur.price)}₽`;showImg();
  $('mBuy').onclick=()=>addToCart(cur.id);productModal.classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){productModal.classList.remove('open');document.body.style.overflow=''}
function showImg(){const a=imgs();$('gImg').src=a[idx];$('prev').style.visibility=$('next').style.visibility=a.length>1?'visible':'hidden'}
$('next').onclick=()=>{idx=(idx+1)%imgs().length;showImg()};
$('prev').onclick=()=>{idx=(idx-1+imgs().length)%imgs().length;showImg()};
$('closeModal').onclick=closeModal;
productModal.onclick=e=>{if(e.target===productModal)closeModal()};
document.onkeydown=e=>{if(e.key==='Escape'){closeModal();drawer.classList.remove('open')}
  if(productModal.classList.contains('open')){if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()}};

/* ---------- корзина ---------- */
function addToCart(id){
  const it=cart.find(x=>x.id===id);it?it.count++:cart.push({id,count:1});saveCart();toast('Товар добавлен в корзину');
}
function renderCart(){
  cart=cart.filter(x=>products.some(p=>p.id===x.id));   // удалённые админом товары пропадают
  let total=0,n=0;
  $('cartList').innerHTML=cart.length?cart.map(x=>{const p=products.find(p=>p.id===x.id);total+=p.price*x.count;n+=x.count;
    return `<div class="row"><img src="${p.image}" loading="lazy" alt=""><div class="n">${esc(p.title)}<br><small>${fmt(p.price)}₽</small></div>
    <div class="qty"><button data-d="-1" data-id="${x.id}">−</button> ${x.count} <button data-d="1" data-id="${x.id}">+</button></div></div>`}).join(''):'<p>Корзина пуста</p>';
  $('cartTotal').textContent=`Итого: ${fmt(total)}₽`;$('cartCount').textContent=n;
}
$('cartList').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;
  const it=cart.find(x=>x.id===b.dataset.id);it.count+=+b.dataset.d;if(it.count<1)cart=cart.filter(x=>x!==it);saveCart()};
$('cartBtn').onclick=()=>drawer.classList.add('open');
$('closeCart').onclick=()=>drawer.classList.remove('open');
$('clearCart').onclick=()=>{cart=[];saveCart()};
function toast(t){const a=$('alertBox');a.textContent=t;a.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>a.classList.add('hidden'),2500)}


/* ---------- оформление заказа ---------- */
function orderText(){let total=0;const lines=cart.map((x,i)=>{const p=products.find(p=>p.id===x.id);if(!p)return'';total+=p.price*x.count;
  return `${i+1}. ${p.title} (${sizeOf(p)}) — ${x.count} × ${fmt(p.price)} ₽ = ${fmt(p.price*x.count)} ₽`}).filter(Boolean);return{text:lines.join('\n'),total}}
const showForm=f=>{$('orderForm').style.display=f?'flex':'none';$('orderDone').style.display=f?'none':'flex'};
$('checkout').onclick=()=>{
  if(!cart.length)return toast('Корзина пуста');
  const o=orderText();$('orderSum').textContent=`Товаров: ${cart.reduce((n,x)=>n+x.count,0)}, сумма: ${fmt(o.total)} ₽`;
  $('oErr').textContent='';showForm(true);orderModal.classList.add('open');
};
const closeOrder=()=>orderModal.classList.remove('open');
$('orderClose').onclick=$('doneClose').onclick=closeOrder;
$('oSend').onclick=async()=>{
  const name=$('oName').value.trim().replace(/\s+/g,' '),phone=$('oPhone').value.trim(),digits=phone.replace(/\D/g,'');
  if(name.split(' ').length<2||name.length<5)return $('oErr').textContent='Введите фамилию и имя (ФИО)';
  if(digits.length<10||digits.length>15||!/^[+\d\s()-]+$/.test(phone))return $('oErr').textContent='Введите корректный номер телефона';
  if(Date.now()-(+localStorage.getItem('lastOrder')||0)<60000)return $('oErr').textContent='Заказ уже отправлен. Подождите минуту.';
  const o=orderText(),order={name,phone,whatsapp:$('oWa').checked,max:$('oMax').checked,text:o.text,total:fmt(o.total)};
  $('oErr').textContent='';$('oSend').disabled=true;$('oSend').textContent='Отправляю…';
  try{
    if(!$('oTrap').value)await sendOrder(order);     // заполненная скрытая ловушка = бот, молча «успех»
    localStorage.setItem('lastOrder',Date.now());
    $('doneTitle').textContent='Заказ отправлен!';$('doneText').textContent='Мы свяжемся с вами по номеру '+phone+'.';['copyOrder','smsOrder','waOrder'].forEach(i=>$(i).hidden=true);
    cart=[];saveCart();drawer.classList.remove('open');
  }catch(e){
    const msg=`Заказ с сайта\n${name}, ${phone}\n${o.text}\nИтого: ${fmt(o.total)} ₽`,num=ORDER_CONFIG.smsPhone;
    $('doneTitle').textContent='Не удалось отправить автоматически';
    $('doneText').textContent='Отправьте заказ сами одним из способов ниже или позвоните нам: '+ORDER_CONFIG.phone;
    $('smsOrder').href=`sms:${num}?&body=${encodeURIComponent(msg)}`;
    $('waOrder').href=`https://wa.me/${num.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
    ['copyOrder','smsOrder','waOrder'].forEach(i=>$(i).hidden=false);
    $('copyOrder').onclick=()=>navigator.clipboard.writeText(msg).then(()=>toast('Скопировано'));
  }
  showForm(false);$('oSend').disabled=false;$('oSend').textContent='Отправить заказ';
};
async function load(){
  try{products=await (await fetch('data/products.json?t='+Date.now())).json();buildFilters();render();renderCart()}
  catch{$('empty').textContent='Не удалось загрузить каталог. Попробуйте обновить страницу.';$('empty').hidden=false}
}
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
